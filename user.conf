#!/usr/bin/env zsh

# ------------------------------------------------------------------------------
# File Purpose
#   This file serves as the foundational configuration layer for Zsh.
#   It is typically sourced by .zshenv or at the very top of .zshrc.
#
# Problems Solved
#   - Establishes critical directory paths before plugins load.
#   - Centralizes feature toggles (Enable/Disable flags).
#   - Handles OS-specific logic (macOS vs Linux) for dotfile locations.
#   - Securely loads environment secrets from an external .env file.
#
# Usage Notes
#   - Toggle features by changing "Yes" to "No".
#   - Adjust `USER_PATH_ENTRIES` to add binaries to your system PATH.
#   - If ENABLE_MINIMAL_MODE=Yes, no other options work except $ZSH_CONFIG_ROOT/.zshrc.mini
# ------------------------------------------------------------------------------


# ── SECURE ENVIRONMENT & SECRETS ────────────────────────────────────
# Looks for a .env file containing API keys and secrets. Loaded first
# so that subsequent variables can rely on secure environment data.

local ENV_SECRET_FILE="$ZDOTDIR/.env"

if [[ -f "$ENV_SECRET_FILE" ]]; then
    # Enable 'allexport': Any variable defined next is automatically exported.
    set -a

    # Source the secrets file into the current shell session.
    source "$ENV_SECRET_FILE"

    # Disable 'allexport': Return to standard safety behavior.
    set +a
fi


# ── CORE DIRECTORIES & PATHS ────────────────────────────────────────
# Defines the physical locations of configuration files and project directories.
# We use standard XDG locations where possible for cleanliness.

# Root directory for the Zsh configuration framework
export ZSH_CONFIG_ROOT="${ZDOTDIR:-$HOME/.config/zsh-conf}/zsh"

# Ensure Cache Directory Exists
export ZSH_CACHE="$HOME/.cache/zsh-cache"
[[ -d "$ZSH_CACHE" ]] || command mkdir -p "$ZSH_CACHE" &>/dev/null

# Location where Zsh dumps its completion cache (speeds up startup)
export ZSH_COMPLETION_DUMP="${ZSH_CACHE:-$HOME/.cache/zsh-cache}/.zcompdump"

# Location of your main dotfiles repository (OS-dependent)
if [[ "$OSTYPE" == "darwin"* ]]; then
    # macOS specific path
    export DOTFILES_ROOT="$HOME/.config/mac-dots"
else
    # Linux / BSD specific path
    export DOTFILES_ROOT="$HOME/.config/b001-dots"
fi


# ── CORE ZSH ARRAYS & ROUTING ───────────────────────────────────────

# Global Uniqueness: Automatically removes duplicates from these arrays
typeset -gU path fpath

# Add custom function folders to fpath (Order: Specific -> Generic -> System)
fpath=("$ZSH_CONFIG_ROOT/lib"{,/functions} $fpath)

# A list of custom paths to append/prepend to the system $PATH.
typeset -ga USER_PATH_ENTRIES
USER_PATH_ENTRIES=(
    "/usr/local/go/bin"     # Absolute: Go Language Binaries
)

# Deferred Path Entries
# Added after the prompt loads to speed up startup.
typeset -ga DEFERRED_PATH_ENTRIES
DEFERRED_PATH_ENTRIES=(
    ".scripts"              # Relative: Personal Shell Scripts
    ".spicetify"            # Relative: Spotify CLI customization
)

# Directory Shortcuts & Project Paths
# Used by: 'pj' command and aliases.zsh (e.g., -pj, -wk)
typeset -gA DIRECTORY_SHORTCUTS
DIRECTORY_SHORTCUTS=(
    [dt]="${DOTFILES_ROOT}"
    [pj]="$HOME/Projects"
    [wk]="$HOME/Work"
    [ws]="$HOME/workspace"
    [cd]="$HOME/Code"
    [dv]="$HOME/Developer"
    [dc]="$HOME/Documents"
    [dl]="$HOME/Downloads"
    [cf]="$HOME/.config"
)


# ── SYSTEM PREFERENCES & TOGGLES ────────────────────────────────────
# Core behavior overrides and visual theming.

# Prompt Theme: Controls the visual appearance of the terminal prompt.
export PROMPT_THEME="gh0st"

# Minimal Mode: Skips heavy plugins for older machines or root users.
export ENABLE_MINIMAL_MODE="No"

# Startup Profiling: Measures how long Zsh takes to load.
# : Only set to Yes if it hasn't been set yet
: ${ZSH_BENCHMARK:="Yes"}


# ── FEATURE FLAGS ───────────────────────────────────────────────────
# Boolean-style flags to enable or disable specific shell capabilities.

# Auto-launch Tmux: Starts a session immediately upon terminal launch.
export ENABLE_AUTO_TMUX="No"

# Custom Aliases: Loads shortcut definitions (e.g., 'g' for 'git').
export LOAD_CUSTOM_ALIASES="Yes"

# Custom Functions: Loads shell functions defined in the config.
export LOAD_CUSTOM_FUNCTIONS="Yes"

# Theme.sh Integration: Enables the 'theme.sh' script for dynamic colors.
export ENABLE_THEME_SH_INTEGRATION="No"

# Private Config: Loads local aliases ignored by git (work-specific settings).
export LOAD_PRIVATE_CONFIG="No"

# Vi Mode: Enables Vim keybindings (k/j/h/l) for the shell line editor.
export ENABLE_VI_MODE="No"


# ── ADVANCED INTEGRATIONS ───────────────────────────────────────────

# Fancy Startup: Displays a banner/logo on shell init.
export ENABLE_FANCY_STARTUP="No"

# Add visual commands for Fancy Startup.
typeset -ga available_visual_commands=("ColorScript --random" "motivate")

# Wallpaper Sync: Reloads shell/colors when wallpaper changes.
export ENABLE_WALLPAPER_SYNC="No"

# Wallpaper Repository Configuration
export WALLPAPER_REPO_USER="adityastomar67"
export WALLPAPER_REPO_NAME="Wallpapers"
export WALLPAPER_REPO_BRANCH="main"

# Multi-Neovim: Enables NVIM_APPNAME switcher (requires Neovim >= 0.9.0).
export ENABLE_MULTI_NEOVIM="No"

if [[ "${ENABLE_MULTI_NEOVIM:l}" == "yes" ]]; then
    # [OPTIONAL] Where to clone the repos?
    NVIM_CONFIG_BASE="$ZSH_CACHE/nvim-profiles"

    # Define the Associative Array (-A) Globally (-g)
    typeset -gA NVIM_DISTROS

    # Configure Distros (Format: [FolderName]="Flag|Git_URL")
    NVIM_DISTROS=(
        [LazyVim]="--lazy|https://github.com/LazyVim/starter"
        [NvChad]="--chad|https://github.com/adityastomar67/NvChad"
        [LazyNV]="--nv|https://github.com/adityastomar67/LazyNV"
        [AstroNvim]="--astro|https://github.com/AstroNvim/AstroNvim"
    )
fi


# ── PLUGINS & TOOLING ───────────────────────────────────────────────
# Definitions for external tool initializers and Zsh plugin managers.

export ZPLUGIN_STORAGE_DIR="$HOME/.local/share/zsh/plugins"

# Define your tools configuration (Format: "Binary : Command : Mode")
typeset -ga INIT_TOOLS
INIT_TOOLS=(
    "starship  : starship init zsh   : immediate" # Prompt
    "dircolors : dircolors -b        : immediate" # Colors
    "zoxide    : zoxide init zsh     : defer"     # Smart cd
    "atuin     : atuin init zsh      : defer"     # Shell History
    "but       : but completions zsh : defer"     # GitButler
)

# Define your plugins here (Syntax: <"defer" (optional)> <"user/repo">)
typeset -ga ZPLUGINS=(
    "defer" "hlissner/zsh-autopair"
    # "defer" "zsh-users/zsh-completions"
    "defer" "Aloxaf/fzf-tab"
    "defer" "zsh-users/zsh-autosuggestions"
    "defer" "zdharma-continuum/fast-syntax-highlighting"
    # "MichaelAquilina/zsh-you-should-use"
)
